name: pr-e2e-test.yml
on:
  pull_request:
    types:
      - labeled
      - synchronize
      - opened
      - reopened

jobs:
  run-e2e-tests:
    if: contains(github.event.pull_request.labels.*.name, 'ok-to-test')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # tag=v7.0.0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # tag=v7.0.0
        with:
          go-version-file: go.mod
      - name: Run e2e tests
        run: make pr-ci-e2e-tests
